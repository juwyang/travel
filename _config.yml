title: 旅行日记
description: 在路上的随笔与笔记
title_en: Travel Notes
description_en: Essays and notes from the road
lang: zh-CN
baseurl: /travel

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  smart_quotes: ["apos", "apos", "quot", "quot"]
  typographic_symbols: { mdash: "---", ndash: "--", hellip: "..." }

exclude:
  - tools
  - README.md
  - "*.zip"

defaults:
  - scope:
      path: "en"
    values:
      lang: en
